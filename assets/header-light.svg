<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="glow-light" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-opacity="0.8" />
    </pattern>
  </defs>

  <style>
    .title-text-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; font-weight: 700; font-size: 30px; fill: #0f172a; letter-spacing: -0.5px; }
    .body-text-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; font-size: 13.5px; fill: #475569; }
    .mono-chip-light { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, monospace; font-size: 11px; fill: #334155; }
    .code-text-light { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, monospace; font-size: 11.5px; }
    .status-text-light { font-family: "SF Mono", "JetBrains Mono", Menlo, monospace; font-size: 10.5px; font-weight: 600; fill: #047857; letter-spacing: 0.5px; }
  </style>

  <!-- Container Box -->
  <rect width="880" height="230" rx="14" fill="url(#bg-grad-light)" stroke="#e2e8f0" stroke-width="1.2" />
  
  <!-- Ambient Glow -->
  <rect width="880" height="230" rx="14" fill="url(#glow-light)" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="880" height="230" rx="14" fill="url(#grid-light)" opacity="0.8" />

  <!-- Accent Top Border Glow -->
  <path d="M 14 0 L 866 0" stroke="url(#accent-line-light)" stroke-width="2" />
  <linearGradient id="accent-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#4f46e5" stop-opacity="0" />
    <stop offset="30%" stop-color="#4f46e5" stop-opacity="0.8" />
    <stop offset="70%" stop-color="#0284c7" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
  </linearGradient>

  <!-- Left Content -->
  <!-- Status Badge -->
  <g transform="translate(36, 28)">
    <rect width="250" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981" />
    <text x="24" y="15.5" class="status-text-light">FULL STACK • 3D • AI SYSTEMS</text>
  </g>

  <!-- Main Headline -->
  <text x="36" y="88" class="title-text-light">Utsav Khatri</text>
  <text x="36" y="116" class="body-text-light">Full Stack Engineer crafting reliable web platforms, interactive 3D, and AI interfaces.</text>
  <text x="36" y="136" class="body-text-light">Focused on high-throughput backend services and refined frontend experiences.</text>

  <!-- Tech Stack Chips -->
  <g transform="translate(36, 168)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="86" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="12" y="17" class="mono-chip-light">TypeScript</text>

    <!-- Chip 2 -->
    <rect x="94" y="0" width="88" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="105" y="17" class="mono-chip-light">React / Next</text>

    <!-- Chip 3 -->
    <rect x="190" y="0" width="94" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="202" y="17" class="mono-chip-light">Node / Hono</text>

    <!-- Chip 4 -->
    <rect x="292" y="0" width="112" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="303" y="17" class="mono-chip-light">Three.js / WebGL</text>

    <!-- Chip 5 -->
    <rect x="412" y="0" width="92" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="423" y="17" class="mono-chip-light">Cloudflare</text>
  </g>

  <!-- Right Side Interactive Card / Terminal -->
  <g transform="translate(544, 28)">
    <!-- Terminal Background -->
    <rect width="300" height="174" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Terminal Header Bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 290 0 C 295.523 0 300 4.477 300 10 L 300 28 L 0 28 Z" fill="#f8fafc" />
    <line x1="0" y1="28" x2="300" y2="28" stroke="#e2e8f0" stroke-width="0.8" />
    
    <!-- Window Control Dots -->
    <circle cx="14" cy="14" r="3.5" fill="#ef4444" opacity="0.8" />
    <circle cx="26" cy="14" r="3.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="38" cy="14" r="3.5" fill="#10b981" opacity="0.8" />
    
    <text x="286" y="17" text-anchor="end" font-family="monospace" font-size="10" fill="#94a3b8">engineer.ts</text>

    <!-- Code Content -->
    <text x="16" y="52" class="code-text-light" fill="#475569"><tspan fill="#7c3aed">interface</tspan> <tspan fill="#0284c7">Profile</tspan> {</text>
    <text x="26" y="74" class="code-text-light" fill="#475569">role: <tspan fill="#059669">'Full Stack Dev'</tspan>;</text>
    <text x="26" y="96" class="code-text-light" fill="#475569">focus: [<tspan fill="#0284c7">'Scale'</tspan>, <tspan fill="#0284c7">'3D'</tspan>, <tspan fill="#0284c7">'AI'</tspan>];</text>
    <text x="26" y="118" class="code-text-light" fill="#475569">cloud: <tspan fill="#059669">'AWS • Cloudflare'</tspan>;</text>
    <text x="26" y="140" class="code-text-light" fill="#475569">status: <tspan fill="#d97706">'shipping_code'</tspan>;</text>
    <text x="16" y="160" class="code-text-light" fill="#475569">}</text>
  </g>
</svg>
