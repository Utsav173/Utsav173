<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" fill="none">
  <defs>
    <!-- Dark Gradients -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow-dark" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Light Gradients -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <radialGradient id="glow-light" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-opacity="0.8" />
    </pattern>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* Default / Light theme */
    .theme-dark { display: none; }
    .theme-light { display: block; }
    
    @media (prefers-color-scheme: dark) {
      .theme-dark { display: block; }
      .theme-light { display: none; }
    }

    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; font-size: 13.5px; }
    .mono-chip { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, monospace; font-size: 11px; }
    .code-text { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, monospace; font-size: 11.5px; }
    .status-text { font-family: "SF Mono", "JetBrains Mono", Menlo, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <!-- DARK MODE WRAPPER -->
  <g class="theme-dark">
    <rect width="880" height="230" rx="14" fill="url(#bg-grad-dark)" stroke="#1e293b" stroke-width="1.2" />
    <rect width="880" height="230" rx="14" fill="url(#glow-dark)" />
    <rect width="880" height="230" rx="14" fill="url(#grid-dark)" opacity="0.65" />
    <path d="M 14 0 L 866 0" stroke="url(#accent-line)" stroke-width="2" />

    <g transform="translate(36, 28)">
      <rect width="250" height="24" rx="12" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="12" cy="12" r="3.5" fill="#10b981" />
      <text x="24" y="15.5" class="status-text" fill="#34d399">FULL STACK • 3D • AI SYSTEMS</text>
    </g>

    <text x="36" y="88" class="title-text" fill="#f8fafc">Utsav Khatri</text>
    <text x="36" y="116" class="body-text" fill="#94a3b8">Full Stack Engineer crafting reliable web platforms, interactive 3D, and AI interfaces.</text>
    <text x="36" y="136" class="body-text" fill="#94a3b8">Focused on high-throughput backend services and refined frontend experiences.</text>

    <g transform="translate(36, 168)">
      <rect x="0" y="0" width="86" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="0.8" />
      <text x="12" y="17" class="mono-chip" fill="#cbd5e1">TypeScript</text>

      <rect x="94" y="0" width="88" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="0.8" />
      <text x="105" y="17" class="mono-chip" fill="#cbd5e1">React / Next</text>

      <rect x="190" y="0" width="94" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="0.8" />
      <text x="202" y="17" class="mono-chip" fill="#cbd5e1">Node / Hono</text>

      <rect x="292" y="0" width="112" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="0.8" />
      <text x="303" y="17" class="mono-chip" fill="#cbd5e1">Three.js / WebGL</text>

      <rect x="412" y="0" width="92" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="0.8" />
      <text x="423" y="17" class="mono-chip" fill="#cbd5e1">Cloudflare</text>
    </g>

    <g transform="translate(544, 28)">
      <rect width="300" height="174" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 290 0 C 295.523 0 300 4.477 300 10 L 300 28 L 0 28 Z" fill="#0f172a" />
      <line x1="0" y1="28" x2="300" y2="28" stroke="#1e293b" stroke-width="0.8" />
      
      <circle cx="14" cy="14" r="3.5" fill="#ef4444" opacity="0.8" />
      <circle cx="26" cy="14" r="3.5" fill="#f59e0b" opacity="0.8" />
      <circle cx="38" cy="14" r="3.5" fill="#10b981" opacity="0.8" />
      <text x="286" y="17" text-anchor="end" font-family="monospace" font-size="10" fill="#64748b">engineer.ts</text>

      <text x="16" y="52" class="code-text" fill="#94a3b8"><tspan fill="#c084fc">interface</tspan> <tspan fill="#38bdf8">Profile</tspan> {</text>
      <text x="26" y="74" class="code-text" fill="#94a3b8">role: <tspan fill="#34d399">'Full Stack Dev'</tspan>;</text>
      <text x="26" y="96" class="code-text" fill="#94a3b8">focus: [<tspan fill="#38bdf8">'Scale'</tspan>, <tspan fill="#38bdf8">'3D'</tspan>, <tspan fill="#38bdf8">'AI'</tspan>];</text>
      <text x="26" y="118" class="code-text" fill="#94a3b8">cloud: <tspan fill="#34d399">'AWS • Cloudflare'</tspan>;</text>
      <text x="26" y="140" class="code-text" fill="#94a3b8">status: <tspan fill="#fbbf24">'shipping_code'</tspan>;</text>
      <text x="16" y="160" class="code-text" fill="#94a3b8">}</text>
    </g>
  </g>

  <!-- LIGHT MODE WRAPPER -->
  <g class="theme-light">
    <rect width="880" height="230" rx="14" fill="url(#bg-grad-light)" stroke="#e2e8f0" stroke-width="1.2" />
    <rect width="880" height="230" rx="14" fill="url(#glow-light)" />
    <rect width="880" height="230" rx="14" fill="url(#grid-light)" opacity="0.8" />
    <path d="M 14 0 L 866 0" stroke="url(#accent-line)" stroke-width="2" />

    <g transform="translate(36, 28)">
      <rect width="250" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
      <circle cx="12" cy="12" r="3.5" fill="#10b981" />
      <text x="24" y="15.5" class="status-text" fill="#047857">FULL STACK • 3D • AI SYSTEMS</text>
    </g>

    <text x="36" y="88" class="title-text" fill="#0f172a">Utsav Khatri</text>
    <text x="36" y="116" class="body-text" fill="#475569">Full Stack Engineer crafting reliable web platforms, interactive 3D, and AI interfaces.</text>
    <text x="36" y="136" class="body-text" fill="#475569">Focused on high-throughput backend services and refined frontend experiences.</text>

    <g transform="translate(36, 168)">
      <rect x="0" y="0" width="86" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="12" y="17" class="mono-chip" fill="#334155">TypeScript</text>

      <rect x="94" y="0" width="88" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="105" y="17" class="mono-chip" fill="#334155">React / Next</text>

      <rect x="190" y="0" width="94" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="202" y="17" class="mono-chip" fill="#334155">Node / Hono</text>

      <rect x="292" y="0" width="112" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="303" y="17" class="mono-chip" fill="#334155">Three.js / WebGL</text>

      <rect x="412" y="0" width="92" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="423" y="17" class="mono-chip" fill="#334155">Cloudflare</text>
    </g>

    <g transform="translate(544, 28)">
      <rect width="300" height="174" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 290 0 C 295.523 0 300 4.477 300 10 L 300 28 L 0 28 Z" fill="#f8fafc" />
      <line x1="0" y1="28" x2="300" y2="28" stroke="#e2e8f0" stroke-width="0.8" />
      
      <circle cx="14" cy="14" r="3.5" fill="#ef4444" opacity="0.8" />
      <circle cx="26" cy="14" r="3.5" fill="#f59e0b" opacity="0.8" />
      <circle cx="38" cy="14" r="3.5" fill="#10b981" opacity="0.8" />
      <text x="286" y="17" text-anchor="end" font-family="monospace" font-size="10" fill="#94a3b8">engineer.ts</text>

      <text x="16" y="52" class="code-text" fill="#475569"><tspan fill="#7c3aed">interface</tspan> <tspan fill="#0284c7">Profile</tspan> {</text>
      <text x="26" y="74" class="code-text" fill="#475569">role: <tspan fill="#059669">'Full Stack Dev'</tspan>;</text>
      <text x="26" y="96" class="code-text" fill="#475569">focus: [<tspan fill="#0284c7">'Scale'</tspan>, <tspan fill="#0284c7">'3D'</tspan>, <tspan fill="#0284c7">'AI'</tspan>];</text>
      <text x="26" y="118" class="code-text" fill="#475569">cloud: <tspan fill="#059669">'AWS • Cloudflare'</tspan>;</text>
      <text x="26" y="140" class="code-text" fill="#475569">status: <tspan fill="#d97706">'shipping_code'</tspan>;</text>
      <text x="16" y="160" class="code-text" fill="#475569">}</text>
    </g>
  </g>
</svg>
